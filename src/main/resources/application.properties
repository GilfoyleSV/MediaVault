spring.application.name=mediavault
spring.datasource.url=jdbc:postgresql://localhost:5432/mediavault
spring.datasource.username=${DB_USER:mediavault}
spring.datasource.password=${DB_PASSWORD:mediavault}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${minio.endpoint}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:media-bucket}
minio.region=${MINIO_REGION:us-east-1}
minio.upload-expiration=${MINIO_UPLOAD_EXPIRATION:15m}
minio.download-expiration=${MINIO_DOWNLOAD_EXPIRATION:60m}
media.max-size-bytes=${MEDIA_MAX_SIZE_BYTES:536870912}
media.cleanup-delay-ms=${MEDIA_CLEANUP_DELAY_MS:60000}
security.jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,storage
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false

