spring.application.name=mediavault
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/MEDIA}
spring.jpa.hibernate.ddl-auto=update
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${minio.endpoint}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:media-bucket}
minio.region=${MINIO_REGION:us-east-1}
minio.upload-expiration=${MINIO_UPLOAD_EXPIRATION:15m}
minio.download-expiration=${MINIO_DOWNLOAD_EXPIRATION:60m}

